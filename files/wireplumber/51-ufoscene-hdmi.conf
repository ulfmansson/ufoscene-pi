# ufoscene: play through HDMI (the TV) rather than the 3.5 mm headphone jack.
#
# On a Pi 2, 3 or 4 WirePlumber otherwise picks the bcm2835 jack ("mailbox") as the default
# output, so a TV gets the picture but no sound. This only lowers the jack's priority: with no
# HDMI audio (a monitor without speakers), the jack is still used.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\\.platform-.*\\.mailbox\\..*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
        priority.driver = 100
      }
    }
  }
]
