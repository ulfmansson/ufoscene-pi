// ufoscene: the Pi as an AirPlay speaker called UFOSCENE. It plays into the kiosk user's
// PipeWire (through its PulseAudio socket), so the TV gets the sound and ufoscene can hear it.
// The metadata pipe tells phone.py the artist and title for the demos.
general = {
  name = "UFOSCENE";
  output_backend = "pa";
  interpolation = "basic"; // light enough for a Pi 2
  // The PulseAudio output has no mixer, so the phone's volume becomes software attenuation over
  // a wide range: a third of the slider was -43 dB, silent on a TV. 30 dB acts like a speaker.
  volume_range_db = 30;
  // One speaker on a TV, not a room of them in step: put up with lateness instead of flushing.
  // By default a packet 50 ms late makes shairport-sync drop audio or play silence to catch up,
  // an audible gap each time, and on a Pi busy with the demos that happened every few seconds.
  resync_threshold_in_seconds = 0.5;
  drift_tolerance_in_seconds = 0.010;
  audio_backend_buffer_desired_length_in_seconds = 0.6;
};

pa = {
  server = "unix:/run/user/@KUID@/pulse/native";
  application_name = "AirPlay";
};

metadata = {
  enabled = "yes";
  include_cover_art = "no"; // ufoscene finds covers itself
  pipe_name = "/run/user/@KUID@/airplay-metadata";
  pipe_timeout = 5000;
};

sessioncontrol = {
  allow_session_interruption = "yes"; // another phone may take over
  session_timeout = 20;
};
